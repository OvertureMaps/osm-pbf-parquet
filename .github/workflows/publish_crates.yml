name: Publish to crates.io

on:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    # Must match the repo/workflow/environment registered as a Trusted
    # Publisher for each crate on crates.io.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Required to mint the crates.io OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # osmpbf is published first since osm-pbf-parquet depends on it.
      # NOTE: rename to osmpbf-async once #43 lands.
      # TODO: repin to a tagged/main ref once OvertureMaps/workflows's
      # publish-crate-to-crates-io PR merges; this SHA is a pre-merge branch commit.
      #
      # The action no longer authenticates itself: each caller mints its own
      # token and passes it through CARGO_REGISTRY_TOKEN on the calling step.
      - name: Authenticate with crates.io (osmpbf)
        id: auth-osmpbf
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish osmpbf
        uses: OvertureMaps/workflows/.github/actions/publish-crate-to-crates-io@814cf6c79dd8dc774f71b52596820fc6e50b4ce8
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-osmpbf.outputs.token }}
        with:
          manifest-path: osmpbf/Cargo.toml
          release-tag: ${{ github.event.release.tag_name }}

      # Re-authenticate for the second crate: a token minted above isn't
      # confirmed to be valid for more than one crate.
      - name: Authenticate with crates.io (osm-pbf-parquet)
        id: auth-osm-pbf-parquet
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish osm-pbf-parquet
        uses: OvertureMaps/workflows/.github/actions/publish-crate-to-crates-io@814cf6c79dd8dc774f71b52596820fc6e50b4ce8
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-osm-pbf-parquet.outputs.token }}
        with:
          manifest-path: osm-pbf-parquet/Cargo.toml
          release-tag: ${{ github.event.release.tag_name }}
