name: Publish to crates.io

on:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    # Must match the repo/workflow/environment registered as a Trusted
    # Publisher for each crate on crates.io.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Required to mint the crates.io OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify Cargo.toml versions match release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          # NOTE: rename to osmpbf-async once #43 lands.
          for manifest in osmpbf/Cargo.toml osm-pbf-parquet/Cargo.toml; do
            actual=$(cargo read-manifest --manifest-path "$manifest" | jq -r '.version')
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$manifest::Cargo.toml version ($actual) does not match release tag ($expected)"
              exit 1
            fi
            echo "$manifest version $actual matches release tag"
          done

      - name: Dry-run publish and check package size
        run: |
          set -euo pipefail
          max_bytes=$((10 * 1024 * 1024))
          # NOTE: rename to osmpbf-async once #43 lands.
          for manifest in osmpbf/Cargo.toml osm-pbf-parquet/Cargo.toml; do
            name=$(cargo read-manifest --manifest-path "$manifest" | jq -r '.name')
            version=$(cargo read-manifest --manifest-path "$manifest" | jq -r '.version')

            cargo publish --dry-run --locked -p "$name"
            cargo package --locked -p "$name"

            crate_file="target/package/${name}-${version}.crate"
            size=$(stat --format=%s "$crate_file")
            echo "$name package size: ${size} bytes"
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::$name package is ${size} bytes, exceeding crates.io's 10MB limit"
              exit 1
            fi
          done

      # osmpbf is published first since osm-pbf-parquet depends on it.
      # NOTE: rename to osmpbf-async once #43 lands.
      - name: Authenticate with crates.io (osmpbf)
        id: auth-osmpbf
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish osmpbf
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-osmpbf.outputs.token }}
        run: cargo publish --locked -p osmpbf

      # Re-authenticate for the second crate: a token minted above isn't
      # confirmed to be valid for more than one crate.
      - name: Authenticate with crates.io (osm-pbf-parquet)
        id: auth-osm-pbf-parquet
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish osm-pbf-parquet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-osm-pbf-parquet.outputs.token }}
        run: cargo publish --locked -p osm-pbf-parquet
