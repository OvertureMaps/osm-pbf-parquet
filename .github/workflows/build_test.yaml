name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust components
      run: rustup component add clippy rustfmt
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: Run clippy
      run: cargo clippy --all-targets -p osm-pbf-parquet
    - name: Run cargo fmt
      run: cargo fmt -p osm-pbf-parquet -- --check

  build-test:
    name: Build/Test
    needs: lint
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
      issues: read  # grype-scan-action reads cve-bypass issues
    uses: lfreleng-actions/rust-workflows/.github/workflows/build-test.yaml@a729f000aa0cf325bb77badaf6420274a028845b # v0.3.0
    with:
      runners: '[{"runner": "ubuntu-latest", "arch": "x64"}, {"runner": "ubuntu-24.04-arm", "arch": "arm64"}]'
      grype_remediation_window_start: '2026-10-30'

  integration-and-bench:
    name: Integration test and benchmark
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Build
      run: cargo build --release -p osm-pbf-parquet
    - name: Install osmium
      run: sudo apt-get update && sudo apt-get install -y osmium-tool
    - name: Prepare and run test
      run: ./test.sh
      working-directory: ./osm-pbf-parquet/test
    - name: Benchmark
      run: cargo bench -p osm-pbf-parquet

  check-crate-packaging:
    name: Check crate packaging
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Check osmpbf-async packages cleanly
      uses: lfreleng-actions/rust-crate-publish-action@10eccc2817792efe202fca20fca72ae34ef8e749 # v0.3.0
      with:
        manifest_path: osmpbf-async/Cargo.toml
        dry_run: "true"

    - name: Check osm-pbf-parquet packages cleanly
      # continue-on-error: osm-pbf-parquet's workspace dependency on
      # osmpbf-async requires version 0.1.0, which isn't published to
      # crates.io yet (only the 0.0.0-reserved placeholder exists), so this
      # dry-run can't resolve it until the first real release publishes
      # osmpbf-async. Remove continue-on-error once that's happened.
      continue-on-error: true
      uses: lfreleng-actions/rust-crate-publish-action@10eccc2817792efe202fca20fca72ae34ef8e749 # v0.3.0
      with:
        manifest_path: osm-pbf-parquet/Cargo.toml
        dry_run: "true"
