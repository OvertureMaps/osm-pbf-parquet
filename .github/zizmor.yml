rules:
  # OvertureMaps/workflows' publish-crate-to-crates-io composite action has no
  # tagged release yet, so its pinned commit can't point at a Git tag. This
  # is expected until that repo cuts a release; the pin itself is still a
  # full commit SHA, so the pin is auditable even without a tag to name it.
  # Remove these once OvertureMaps/workflows tags a release for the action.
  stale-action-refs:
    ignore:
      - publish_crates.yml:80:15
      - publish_crates.yml:102:15
      - build_test.yaml:93:13
      - build_test.yaml:105:13
