[workspace]
members = ["osm-pbf-parquet", "osmpbf-async"]
resolver = "2"

# Measured ~4% CPU reduction on transcode (cross-crate inlining into the
# arrow builder and decode hot paths); build-time cost only affects release
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
osmpbf = { package = "osmpbf-async", path = "osmpbf-async", version = "0.1.0", default-features = false, features = ["rust-zlib", "async"] }
